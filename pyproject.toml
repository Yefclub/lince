[project]
name = "lince"
version = "0.1.1.dev20261108041309"
description = "Leitor único de documentos: extração nativa + modelo de visão plugável, com cache, metadados e proteção contra prompt injection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "firecrawl-anydoc==0.2.4",   # MIT — Office, ODF, RTF, EPUB, CSV, legados
  "pdf-inspector==1.25.2",     # MIT — texto e tabelas do PDF, posições
  "pypdfium2>=5.14,<6",        # Apache-2.0/BSD-3 — objetos da página, recorte, renderização
  "openpyxl>=3.1.5,<4",        # MIT — imagens e gráficos de XLSX
  "python-pptx>=1.0.2,<2",     # MIT — setas de fluxograma em PPTX
  "Pillow>=13",                # MIT-CMU — imagem
  "defusedxml>=0.7",           # PSF — o openpyxl só lê XML com proteção se ele estiver instalado
  "lxml>=6.1",                 # BSD-3 — edição cirúrgica de OOXML (documento como código)
  "olefile>=0.47,<1",          # BSD-2 — cabeçalho, rodapé e macro dos binários do Office (DOC, XLS, PPT)
  "html-to-markdown>=3.20,<4", # MIT — HTML para Markdown (núcleo em Rust, sem dependências)
  "tinycss2>=1.4,<2",          # BSD-3 — style do HTML com a sintaxe e a cascata do CSS
  "resvg-py>=0.5,<0.6",        # MIT (no LICENSE do pacote; o PyPI não traz o campo) — desenha o SVG
]

[project.optional-dependencies]
servidor = ["starlette>=1.10", "uvicorn>=0.54", "python-multipart>=0.0.32", "redis>=8.1,<9"]  # BSD-3 / BSD-3 / Apache-2.0 / MIT
redis = ["redis>=8.1,<9"]  # MIT — CacheRedis para quem usa o Lince como lib

[dependency-groups]
# só desenvolvimento e CI (não vão para a imagem); versões travadas no uv.lock e atualizadas pelo Dependabot
dev = [
  "pytest>=9.2",
  "reportlab>=5.1",
  "python-docx>=1.2",
  "httpx2>=2.16",
  "jsonschema>=4.26",
  "openapi-spec-validator>=0.9",
  "ruff>=0.17",
  "pip-audit>=2.10",
]

[project.scripts]
lince = "lince.cli:main"
lince-servidor = "lince.servidor:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
lince = ["prompts/*.md", "openapi.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = [
  "S101",  # assert nos testes
  "S104",  # o servidor escuta em todas as interfaces dentro do contêiner
  "S310",  # urlopen recebe a URL do provedor escolhido por quem chama
  "S311",  # random só no jitter da repetição
  "S314",  # xml.etree com expat >= 2.4.1 já barra entidade externa e expansão em massa
  "E741",  # l, b, r, t são as bordas da caixa (convenção do PDF)
]

[tool.ruff.lint.per-file-ignores]
# lambdas de re.sub/min consumidas na mesma iteração do laço: não há captura tardia
"src/lince/montagem.py" = ["B023"]
"src/lince/office.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Versão publicada há menos de 3 dias não entra (janela para retirada de pacote comprometido); igual ao cooldown do Dependabot.
exclude-newer = "3 days"
